
name: Build LupinoOre

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Forge MDK
        run: |
          curl -L --fail --retry 3 \
            -o forge-mdk.zip \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-mdk.zip

      - name: Prepare project
        run: |
          mkdir forge-mdk
          unzip -q forge-mdk.zip -d forge-mdk

          test -f forge-mdk/gradlew
          test -f forge-mdk/build.gradle

          rm -rf forge-mdk/src/main/java
          rm -rf forge-mdk/src/main/resources

          mkdir -p forge-mdk/src/main/java
          mkdir -p forge-mdk/src/main/resources

          cp -R src/. forge-mdk/src/

          sed -i -E "s/^[[:space:]]*archivesBaseName[[:space:]]*=.*/archivesBaseName = 'LupinoOre'/" forge-mdk/build.gradle
          sed -i -E "s/^[[:space:]]*version[[:space:]]*=.*/version = '1.0.0'/" forge-mdk/build.gradle

          grep -nE "^(archivesBaseName|version)[[:space:]]*=" forge-mdk/build.gradle

      - name: Build mod
        working-directory: forge-mdk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Verify mod files
        working-directory: forge-mdk
        run: |
          JAR="build/libs/LupinoOre-1.0.0.jar"

          test -f "$JAR"
          jar tf "$JAR" | grep -Fx 'com/lupinoore/LupinoOre.class'
          jar tf "$JAR" | grep -Fx 'mcmod.info'

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: LupinoOre-1.0.0
          path: forge-mdk/build/libs/LupinoOre-1.0.0.jar
          if-no-files-found: error
