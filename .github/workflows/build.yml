name: Build LupinoOre

'on':
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 8
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '8'

  - name: Download Forge MDK
    run: |
      set -euo pipefail
      curl -L --fail --retry 3 \
        -o forge-mdk.zip \
        https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-mdk.zip
      mkdir -p forge-mdk
      unzip -q -o forge-mdk.zip -d forge-mdk

  - name: Install mod source
    run: |
      set -euo pipefail
      if [ -d src ]; then
        cp -R src/. forge-mdk/src/
      elif [ -d forge-mdk/src ]; then
        echo "Using source files from Forge MDK directory."
      else
        echo "::error::Mod source directory not found."
        exit 1
      fi

  - name: Build mod
    working-directory: forge-mdk
    run: |
      chmod +x gradlew
      ./gradlew --no-daemon clean build

  - name: Upload compiled mod
    uses: actions/upload-artifact@v4
    with:
      name: LupinoOre-1.12.2
      path: forge-mdk/build/libs/*.jar
      if-no-files-found: error
