name: Build LupinoOre

'on': 
  push: 
    workflow_dispatch:

jobs: 
  build: 
    runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 8
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '8'

  - name: Download Forge MDK
    run: |
      set -euo pipefail
      curl -L --fail --retry 3 \
        -o forge-mdk.zip \
        https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-mdk.zip
      mkdir -p forge-mdk
      unzip -q -o forge-mdk.zip -d forge-mdk

  - name: Install mod source
    run: |
      set -euo pipefail
      if [ ! -d src ]; then
        echo "::error::The repository root must contain the src directory with mod source files."
        exit 1
      fi
      mkdir -p forge-mdk/src
      cp -R src/. forge-mdk/src/

  - name: Install texture assets
    run: |
      set -euo pipefail
      if [ ! -f LupinoOre_Texture_Assets.zip ]; then
        echo "::error::LupinoOre_Texture_Assets.zip was not found in the repository root."
        exit 1
      fi
      mkdir -p texture-assets
      unzip -q -o LupinoOre_Texture_Assets.zip -d texture-assets
      ASSET_DIR="$(find texture-assets -type d -path '*/assets/lupinoore' -print -quit)"
      if [ -z "$ASSET_DIR" ]; then
        echo "::error::Archive does not contain assets/lupinoore."
        exit 1
      fi
      mkdir -p forge-mdk/src/main/resources/assets
      cp -R "$ASSET_DIR" forge-mdk/src/main/resources/assets/
      echo "Texture assets installed successfully."
      find forge-mdk/src/main/resources/assets/lupinoore -type f

  - name: Build mod
    working-directory: forge-mdk
    run: |
      set -euo pipefail
      chmod +x gradlew
      ./gradlew --no-daemon clean build

  - name: Upload compiled mod
    uses: actions/upload-artifact@v4
    with:
      name: LupinoOre-1.12.2
      path: forge-mdk/build/libs/*.jar
      if-no-files-found: error
