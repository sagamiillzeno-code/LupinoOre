name: Build LupinoOre

'on':
push:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 8
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '8'

  - name: Download Forge MDK
    run: |
      set -euo pipefail
      curl -L --fail --retry 3 \
        -o forge-mdk.zip \
        https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-mdk.zip
      mkdir -p forge-mdk
      unzip -q -o forge-mdk.zip -d forge-mdk

  - name: Install LupinoOre texture assets
    run: |
      set -euo pipefail
      ARCHIVE="LupinoOre_Texture_Assets.zip"

      if [ ! -f "$ARCHIVE" ]; then
        echo "::error::LupinoOre_Texture_Assets.zip is missing from the repository root."
        exit 1
      fi

      mkdir -p texture-assets
      unzip -q -o "$ARCHIVE" -d texture-assets

      if [ ! -d texture-assets/assets/lupinoore ]; then
        echo "::error::Archive must contain assets/lupinoore/"
        exit 1
      fi

      mkdir -p forge-mdk/src/main/resources/assets
      cp -R texture-assets/assets/. forge-mdk/src/main/resources/assets/

      test -f forge-mdk/src/main/resources/assets/lupinoore/textures/blocks/lupino_ore.png
      test -f forge-mdk/src/main/resources/assets/lupinoore/models/block/lupino_ore.json
      test -f forge-mdk/src/main/resources/assets/lupinoore/models/item/lupino_ore.json
      test -f forge-mdk/src/main/resources/assets/lupinoore/blockstates/lupino_ore.json

  - name: Build mod
    working-directory: forge-mdk
    run: |
      chmod +x gradlew
      ./gradlew --no-daemon clean build

  - name: Upload compiled mod
    uses: actions/upload-artifact@v4
    with:
      name: LupinoOre-1.12.2
      path: forge-mdk/build/libs/*.jar
      if-no-files-found: error
